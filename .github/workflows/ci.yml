name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check for changeset
        run: bunx changeset status --since origin/main

  checks-passed:
    name: Checks Passed
    needs: [test, changeset-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or skipped
        run: |
          test="${{ needs.test.result }}"
          changeset="${{ needs.changeset-check.result }}"
          if [[ "$test" != "success" && "$test" != "skipped" ]]; then
            echo "Test failed: $test"
            exit 1
          fi
          if [[ "$changeset" != "success" && "$changeset" != "skipped" ]]; then
            echo "Changeset check failed: $changeset"
            exit 1
          fi
          echo "All checks passed"
